<rect class="bg" width="1200" height="300" rx="14"/>
<text class="code" x="40" y="276" font-size="15" letter-spacing="1">++++++++++[&gt;+++++++&gt;++++++++++&gt;+++&gt;+&lt;&lt;&lt;&lt;-]&gt;++.&gt;+.+++++++..+++.&gt;++.&lt;&lt;+++++++++++++++.&gt;.+++.------.--------.&gt;+.&gt;.</text>
<text class="t" x="40" y="104" font-size="64" font-weight="700" letter-spacing="-1">Brainfuck<tspan class="a">PC</tspan></text>
