<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="BrainfuckPC — 16-bit relay computer">

<style>
  .bg{fill:#fbf8f1}.panel{fill:#f1ebdd;stroke:#d8ccb0}
